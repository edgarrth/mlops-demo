name: Monitor drift

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 1'

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar monitoreo de septiembre
        run: PYTHONPATH=. python scripts/monitor.py --month 201509
      - name: Guardar reporte de drift
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: reports/monitoring/
