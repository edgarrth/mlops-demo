name: Train model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'config.yaml'
      - 'data/original/**'

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Entrenar y aplicar quality gate
        run: PYTHONPATH=. python scripts/train.py
      - name: Probar la API con el modelo generado
        run: |
          PYTHONPATH=. uvicorn api.main:app --host 127.0.0.1 --port 8000 &
          sleep 5
          curl --fail http://127.0.0.1:8000/health
      - name: Guardar resultados
        uses: actions/upload-artifact@v4
        with:
          name: modelo-y-reportes
          path: |
            artifacts/
            reports/
