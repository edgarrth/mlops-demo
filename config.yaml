project_name: renovacion-prestamo-mlops

data:
  path: data/original/Dataset Renovacion_prestamo.csv
  target: FLAG_VENTA
  id_column: CLIENTE
  time_column: MES
  train_end: 201506
  validation_months: [201507, 201508]
  test_month: 201509

model:
  random_state: 42
  top_fraction: 0.10
  experiment_sample_size: 20000

quality_gate:
  min_pr_auc: 0.06
  min_roc_auc: 0.62
  min_lift_at_10: 1.50

mlflow:
  experiment_name: renovacion-prestamo
  tracking_uri: sqlite:///mlflow.db

monitoring:
  psi_warning: 0.10
  psi_critical: 0.25
  ks_pvalue: 0.05
