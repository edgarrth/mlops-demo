stages:
  validate:
    cmd: PYTHONPATH=. python scripts/validate_data.py
    deps:
      - data/raw/Dataset Renovacion_prestamo.csv
      - scripts/validate_data.py
  train:
    cmd: PYTHONPATH=. python scripts/train.py
    deps:
      - data/raw/Dataset Renovacion_prestamo.csv
      - src
      - scripts/train.py
      - config.yaml
    outs:
      - artifacts/model.joblib
    metrics:
      - artifacts/metrics.json
